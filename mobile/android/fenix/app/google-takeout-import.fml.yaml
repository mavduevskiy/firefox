---
features:
  google-takeout-import:
    description: >
      Imports bookmarks from a Google account by driving a Google Takeout
      export in a hidden tab with the web flow runner extension.
    variables:
      enabled:
        description: If true, the "Import from Google" entry point is shown.
        type: Boolean
        default: true
      launch-url:
        description: The URL the hidden tab starts on.
        type: String
        default: "https://takeout.google.com/"
      hosts:
        description: Hosts on which the journey runs.
        type: List<String>
        default: ["takeout.google.com"]
      auth-hosts:
        description: Hosts that mean the user has to authenticate before the journey can continue.
        type: List<String>
        default: ["accounts.google.com"]
      path-prefix-pattern:
        description: >
          Regular expression for a path prefix removed before matching journey
          pages, and available to actions as the `{prefix}` variable.
        type: String
        # No backslashes: the FML code generator does not escape them.
        default: "^/u/[0-9]+"
      timeout-ms:
        description: Default time an action waits for its target.
        type: Int
        default: 25000
      settle-ms:
        description: Time to wait after a click before running the next action.
        type: Int
        default: 500
      selectors:
        description: CSS selectors, by the name actions use to reference them.
        type: Map<String, String>
        default:
          {
            "top-deselect-all": 'div[role="tabpanel"] div:nth-child(2) div:nth-child(2) button, div[role="tabpanel"] button[aria-label="Deselect all"]',
            "chrome-unchecked": 'input[name="Chrome"]:not(:checked)',
            "chrome-section": 'c-wiz [data-id="chrome"]',
            "chrome-checkbox": 'input[name="Chrome"]',
            "chrome-data-button": 'div[data-id="chrome"] div[data-is-transfer="false"] button:not([disabled])',
            "chrome-data-modal": "fieldset.rcetic",
            "modal-deselect-all": 'fieldset.rcetic div:nth-child(2) button:nth-of-type(2), fieldset.rcetic button[aria-label="Deselect all"]',
            "bookmarks-unchecked": 'fieldset.rcetic input[value="bookmarks"]:not(:checked)',
            "bookmarks-checked": 'fieldset.rcetic input[value="bookmarks"]:checked',
            "ok-button-enabled": 'div[isfullscreen] div:nth-child(3) > div[role="button"]:not([aria-disabled]):nth-of-type(2)',
            "next-step-button": 'div[role="tabpanel"] > div:nth-child(1) > div:nth-child(2) button, div[role="tabpanel"] button[aria-label="Next step"]',
            "create-export-button": 'div[data-configure-step="1"] button',
            "pending-archive": 'div[data-in-progress="true"][data-archive-id]',
            "download-link": 'div[data-is-downloaded="false"] a[href*="&i=0&user="]',
          }
      journey:
        description: The pages of the export journey, matched in order.
        type: List<WebFlowPage>
        default:
          [
            {
              "id": "configure-export",
              "path-pattern": "^(/settings/takeout)?/?$",
              "actions": [
                { "id": "deselect-all-click", "type": "click", "selector-ref": "top-deselect-all" },
                {
                  "id": "deselect-all-confirmed",
                  "type": "expect",
                  "expectations": [{ "type": "element", "selector-ref": "chrome-unchecked" }],
                },
                { "id": "chrome-section-scroll", "type": "scroll", "selector-ref": "chrome-section" },
                { "id": "chrome-section-click", "type": "click", "selector-ref": "chrome-checkbox" },
                { "id": "chrome-data-button-click", "type": "click", "selector-ref": "chrome-data-button" },
                {
                  "id": "chrome-data-modal-shown",
                  "type": "expect",
                  "expectations": [{ "type": "element", "selector-ref": "chrome-data-modal" }],
                },
                { "id": "modal-deselect-all-click", "type": "click", "selector-ref": "modal-deselect-all" },
                {
                  "id": "modal-deselect-all-confirmed",
                  "type": "expect",
                  "expectations": [{ "type": "element", "selector-ref": "bookmarks-unchecked" }],
                },
                { "id": "bookmarks-checkbox-click", "type": "click", "selector-ref": "bookmarks-unchecked" },
                {
                  "id": "bookmarks-checked",
                  "type": "expect",
                  "expectations":
                    [
                      { "type": "element", "selector-ref": "bookmarks-checked" },
                      { "type": "element", "selector-ref": "ok-button-enabled" },
                    ],
                },
                { "id": "ok-button-click", "type": "click", "selector-ref": "ok-button-enabled" },
                { "id": "next-step-scroll", "type": "scroll", "selector-ref": "next-step-button" },
                { "id": "next-step-click", "type": "click", "selector-ref": "next-step-button" },
                { "id": "create-export-scroll", "type": "scroll", "selector-ref": "create-export-button" },
                { "id": "create-export-click", "type": "click", "selector-ref": "create-export-button" },
                { "id": "navigate-to-manage", "type": "navigate", "url": "{prefix}/manage" },
              ],
            },
            {
              "id": "download-archive",
              "path-pattern": "^/manage/archive/",
              "once": true,
              "actions": [
                {
                  "id": "download-link-click",
                  "type": "click",
                  "selector-ref": "download-link",
                  "timeout-ms": 300000,
                },
              ],
            },
            {
              "id": "wait-for-export",
              "path-pattern": "^/(manage|downloads)",
              "actions": [
                {
                  "id": "export-id-found",
                  "type": "extract",
                  "selector-ref": "pending-archive",
                  "attribute": "data-archive-id",
                  "variable": "archiveId",
                  "timeout-ms": 300000,
                },
                {
                  "id": "export-ready",
                  "type": "expect",
                  "expectations":
                    [{ "type": "gone", "selector-ref": "pending-archive", "timeout-ms": 300000 }],
                },
                {
                  "id": "navigate-to-archive",
                  "type": "navigate",
                  "url": "{prefix}/manage/archive/{archiveId}",
                },
              ],
            },
          ]
