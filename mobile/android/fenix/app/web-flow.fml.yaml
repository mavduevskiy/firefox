---
# Generic building blocks for web flows driven by the built-in flow runner
# extension. A feature describing a flow declares its pages as
# `List<WebFlowPage>`; selectors are referenced by name so they can be
# overridden in a separate, smaller variable.
objects:
  WebFlowPage:
    description: The actions to run on pages whose path matches `path-pattern`.
    fields:
      id:
        type: String
        description: Identifier reported when the page starts running.
        default: ""
      path-pattern:
        type: String
        description: >
          Regular expression matched against the page path, after the
          flow's path prefix is removed.
        default: ""
      once:
        type: Boolean
        description: >
          If true, the actions run at most once per attempt for a given path.
          Used for pages that reload themselves after an action.
        default: false
      retry-after-auth:
        type: Boolean
        description: >
          For `once` pages: if true, the page may run again after the user
          went through an auth page, because the interrupted actions did not
          take effect. Set to false when the site continues on its own after
          authentication.
        default: true
      actions:
        type: List<WebFlowAction>
        description: The actions to run, in order.
        default: []

  WebFlowAction:
    description: A single step executed by the flow runner.
    fields:
      id:
        type: String
        description: Identifier reported with the result of the action.
        default: ""
      type:
        type: Option<WebFlowActionType>
        description: What the action does. Actions with an unknown type fail validation.
        default: null
      selector-ref:
        type: Option<String>
        description: Name of the selector, in the flow's selectors map, the action targets.
        default: null
      timeout-ms:
        type: Option<Int>
        description: How long to wait for the target. Defaults to the flow's timeout.
        default: null
      attribute:
        type: Option<String>
        description: For `extract`, the attribute to read from the target.
        default: null
      variable:
        type: Option<String>
        description: For `extract`, the variable the value is stored in.
        default: null
      url:
        type: Option<String>
        description: For `navigate`, the URL to load. `{name}` is replaced by the variable value.
        default: null
      expectations:
        type: List<WebFlowExpectation>
        description: For `expect`, the conditions that must all hold.
        default: []

  WebFlowExpectation:
    description: A condition awaited by an `expect` action.
    fields:
      type:
        type: Option<WebFlowExpectationType>
        description: The kind of condition.
        default: null
      selector-ref:
        type: Option<String>
        description: For `element` and `gone`, the name of the selector.
        default: null
      pattern:
        type: Option<String>
        description: For `url`, a regular expression the page URL must match.
        default: null
      timeout-ms:
        type: Option<Int>
        description: How long to wait. Defaults to the action's timeout.
        default: null

enums:
  WebFlowActionType:
    description: The actions supported by the flow runner.
    variants:
      click:
        description: Wait for the target and click it.
      scroll:
        description: Wait for the target and scroll it into view.
      expect:
        description: Wait until all expectations hold.
      extract:
        description: Wait for the target and store one of its attributes in a variable.
      navigate:
        description: Load a new URL.

  WebFlowExpectationType:
    description: The conditions an `expect` action can wait for.
    variants:
      element:
        description: An element matching the selector exists.
      gone:
        description: No element matches the selector.
      url:
        description: The page URL matches the pattern.
