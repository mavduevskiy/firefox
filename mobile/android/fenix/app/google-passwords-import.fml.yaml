---
features:
  google-passwords-import:
    description: >
      Imports passwords from a Google account by driving the Google Password
      Manager export in a hidden tab with the web flow runner extension. The
      journey comes from the `web-flow-journeys` Remote Settings collection.
    variables:
      enabled:
        description: If true, the "Import from Google" entry point is shown in saved logins.
        type: Boolean
        default: true
