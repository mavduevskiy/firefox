---
features:
  google-passwords-import:
    description: >
      Imports passwords from a Google account by driving the Google Password
      Manager export in a hidden tab with the web flow runner extension.
    variables:
      enabled:
        description: If true, the "Import from Google" entry point is shown in saved logins.
        type: Boolean
        default: true
      launch-url:
        description: The URL the hidden tab starts on.
        type: String
        default: "https://passwords.google.com/options"
      hosts:
        description: Hosts on which the journey runs.
        type: List<String>
        default: ["passwords.google.com"]
      auth-hosts:
        description: Hosts that mean the user has to authenticate before the journey can continue.
        type: List<String>
        default: ["accounts.google.com"]
      download-file-pattern:
        description: >
          Regular expression the name of the exported file must match. The
          export is a `blob:` download without a host, so it is matched by name.
        type: String
        # No backslashes: the FML code generator does not escape them.
        default: "^Google Passwords.*[.]csv$"
      path-prefix-pattern:
        description: >
          Regular expression for a path prefix removed before matching journey
          pages, and available to actions as the `{prefix}` variable.
        type: String
        default: "^/u/[0-9]+"
      timeout-ms:
        description: Default time an action waits for its target.
        type: Int
        default: 25000
      settle-ms:
        description: Time to wait after a click before running the next action.
        type: Int
        default: 500
      selectors:
        description: CSS selectors, by the name actions use to reference them.
        type: Map<String, String>
        default:
          {
            "export-button": 'div[jsname="Qo3m8c"] button',
            "export-confirm-button": 'div[role="dialog"] button[data-mdc-dialog-action="ok"]',
          }
      journey:
        description: The pages of the export journey, matched in order.
        type: List<WebFlowPage>
        default:
          [
            {
              "id": "export-passwords",
              "path-pattern": "^/options",
              "once": true,
              "retry-after-auth": false,
              "actions": [
                { "id": "export-click", "type": "click", "selector-ref": "export-button" },
                { "id": "export-confirm-click", "type": "click", "selector-ref": "export-confirm-button" },
              ],
            },
          ]
