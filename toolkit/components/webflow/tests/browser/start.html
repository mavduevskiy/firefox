<!doctype html>
<html>
<head><meta charset="utf-8"><title>Web flow test: start</title></head>
<body>
  <button id="start">Start</button>
  <script>
    // Clicking start shows a pending item that goes away after a while and
    // leaves a result carrying the id the journey extracts.
    document.getElementById("start").addEventListener("click", () => {
      const pending = document.createElement("div");
      pending.className = "pending";
      pending.dataset.id = "item-42";
      document.body.append(pending);
      setTimeout(() => pending.remove(), 300);
    });
  </script>
</body>
</html>
